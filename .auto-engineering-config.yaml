# 自动化工程开发工作流配置 (auto-engineering-workflow skill)
# skill 脚本(Phase 1-3)选项;无人值守系统配置由 scripts/install-unattended.sh 提供

repository:
  owner: "stflj2022"
  repo: "DF-FanYi"        # 远端暂为 EPUB-AI-Fanyi,重命名后同步
  branch: "main"

git:
  target:
    remote: "origin"
    branch: "main"

matt_skills:
  issue_tracker: "local"   # 无 GitHub API token,工单用本地文件 docs/tickets/
  triage_labels: ["feature", "bug", "refactor", "docs"]
  docs_path: "docs"
  adr_path: "docs/adr"

code_review:
  pre_commit_required: true
  max_review_attempts: 3
  parallel_axes: true
  standards_axis:
    include_smell_baseline: true
    override_with_repo_standards: true
  spec_axis:
    spec_sources_priority:
      - "docs_specs"        # docs/specs/
      - "issue_references"
      - "user_argument"
      - "scratch"
  fail_on_any_finding: false
  auto_fix_minor_issues: true

user_confirmation:
  download_retry_count: 10
  first_response_timeout_minutes: 20
  retry_interval_hours: 1
  max_retry_cycles: 3

unattended:
  install_script: "scripts/install-unattended.sh"
  driver_service: "dffanyi-driver.service"
  watchdog_timer: "dffanyi-watchdog.timer"
  progress_report_timer: "dffanyi-progress-report.timer"
  completion_check: "scripts/completion-check.sh"
  shutdown_script: "scripts/shutdown-unattended.sh"
  main_tickets_dir: "docs/tickets"
  driver_log: ".unattended/driver.log"
  progress_report_log: ".unattended/progress-report.log"
  progress_report_interval_minutes: 30
  watchdog_interval_minutes: 10
  notification_enabled: true
