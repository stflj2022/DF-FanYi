# DF-FanYi 引擎默认配置(工程书 §47)
# 分层: 本文件为默认值 → 用户 ~/.config/df-fanyi/config.yaml 整树覆盖(见 df_fanyi/config.py)
# 密钥铁律(§2.4/§56): 配置文件永不包含真实密钥; provider 只引用环境变量名(api_key_env)

logging:                 # 工程书 §45
  level: INFO            # 默认 INFO; 开发可调 DEBUG
  dir: logs              # 相对仓库根(§48); 可被用户覆盖
  engine_log: engine.log

cache:                   # 工程书 §9/§37: 两级缓存(L1 内存 LRU, L2 SQLite)
  l1_size: 512           # L1 最大句数(内存)
  l2_backend: sqlite     # L2 后端; ticket-006 落地
  l2_path: data/engine.db  # L2 SQLite 库文件(相对仓库根; 测试/运维可覆盖为临时路径)

context:                 # 工程书 §36: 上下文不允许无限增长
  max_tokens: 3500
  recent_events: 10
  recent_texts: 10

queue:                   # 工程书 §25-30: 优先级队列与调度(ticket-007 实现)
  workers_local: 1       # 本地 worker 数(§26/§27: 不在 4800U 上大量并发 LLM)
  max_attempts: 3
  realtime_timeout_ms: 10000   # §29: >10s 的 realtime 任务降级
  priorities: [P0, P1, P2, P3, P4]
  # §34 阈值实测初值(ticket-010, 2026-09-08, 60 真实游戏句基准):
  # - 词典/规则可解句(Test 1-3 词/模板)实测复杂度 ≤0.12, 全部 < 0.25 → 同步快路径;
  # - 真实自然句(公告/描述/历史)复杂度 0.01-0.12(短)至 ~0.5(250+ 字符描述),
  #   但快路径均未命中 → 全部入队异步(LLM 职责); 即本阈值在真实文本上仅起
  #   「词典/规则句同步返回」作用, 无误分桁 —— 0.25 实测安全, 保持不变;
  # - 结论: 复杂度分数对真实 DF 文本的 LLM 难度区分力弱(§34 0.45/0.65/0.8 档
  #   只由长度分量触发), 第三阶段云路由不能只靠此分数, 需叠加 text_type/长度/验证反馈。
  async_threshold: 0.25        # §34: 复杂度 ≤ 词典/规则档(≈0.25)走同步快路径
  max_queue: 32                # §27 本地 LLM max_queue(满员拒绝新任务不阻塞)

local_llm:               # 工程书 §27/§14: 本地 gemma E4B
  workers: 1             # 本地并发恒 1(CPU 单实例)
  max_queue: 32          # §27: 等待队列上限(ticket-007 起生效)
  model: gemma-4b-trans
  base_url: http://127.0.0.1:11434
  # ticket-010 实测(60 真实句, num_predict 修正后): p50≈58s p95≈77s
  # (含 ~500 token thinking 阶段, ~9.5 tok/s CPU); 120s 覆盖 p95, 保持不变。
  timeout_s: 120

providers:               # 工程书 §12/§17: OpenAI-compatible = base_url + api_key_env + model
  - name: ollama         # 第一版唯一启用: 本地模型(无 key)
    base_url: http://127.0.0.1:11434
    api_key_env: ""      # 本地模型无 key; 云端填环境变量名(见 providers.example.yaml)
    model: gemma-4b-trans
    enabled: true

privacy:                 # 工程书 §46
  store_source_text: true  # false 时日志/库只存 hash

pretranslate:            # ticket-011: 云端批量预翻译 vanilla raws(离线翻译包)
  vanilla_dir: "/home/wu/Games/DF-v5306/Dwarf Fortress/data/vanilla"  # Steam 版 v53.06 整合包本体(纯 ASCII 路径, 2026-09-09 从经典版迁移)
  subdirs:               # 扫描范围: 叙事内容目录(languages 字典词/text 模板文本不扫)
    - vanilla_creatures
    - vanilla_creatures_extinct
    - vanilla_items
    - vanilla_plants
    - vanilla_materials
    - vanilla_descriptors
    - vanilla_entities
    - vanilla_buildings
    - vanilla_interactions
    - vanilla_environment
  progress_path: data/pretranslate_progress.json  # 进度=离线翻译包(断点续跑)
  report_path: docs/audits/PRETRANSLATE_SCAN.md   # scan 报告
  batch_size: 12          # 每请求打包句数(10-20, 工单约定)
  request_interval_s: 2.0 # 请求间隔 ≥2s(节流, 绝不轰炸 router)
  max_retries: 5          # 单批重试上限(503/额度耗尽/输出不齐)
  backoff_initial_s: 2.0  # 指数退避初值
  backoff_max_s: 120.0    # 退避上限
  router_max_tokens: 4096 # 批量输出+可能思维链的 token 预算(2048 会被 thinking 吃空)
  router_host: http://127.0.0.1:8010  # Pi Model Router(§12, 不直连上游)
  router_model: router/L2             # 云端优先(ADR-cloud-first-translation)
  router_timeout_s: 120

bridge:                   # 工程书 §21-22/§43-44: 游戏↔引擎 JSON-RPC 桥(ticket-008)
  enabled: true           # 引擎启动时是否随之启动桥监听
  transport: tcp          # tcp=loopback(游戏侧 DFHack luasocket 官方仅 TCP); unix=主机侧工具/测试
  host: 127.0.0.1         # tcp 监听地址(只回环, 不暴露到局域网)
  port: 17486             # tcp 监听端口(0=随机, 测试用)
  socket_path: data/engine.sock  # unix 传输的套接字路径
  results_capacity: 1024  # 已完译文缓冲上限(游戏侧轮询取回前暂存)
  results_ttl_s: 300      # 缓冲记录 TTL(秒), 超时淘汰防泄漏
  version: 0.1.0          # 引擎桥侧版本号(health/version 上报)
