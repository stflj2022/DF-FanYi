# DF-FanYi seed 术语词典(ticket-004, database/ 内置, YAML 起步; SQLite 由 ticket-006)
#
# 数据来源与许可:
#   本表为 dfi18n-data-zh-hans(simple/zh-Hans.csv, 901 行)与
#   dfzh(dfzh_dict_exact.csv, 1884 行)高频词的手工整理子集, 经人工校对补充。
#   原始数据许可: CC BY-NC 4.0(矮人要塞中文维基翻译组)
#   —— 非商业使用; 转载/再分发须保留本署名。详见 docs/audits/REUSE_PLAN.md §6。
#
# 字段:
#   source: 英文原词(查询大小写不敏感, 整句精确匹配)
#   target: 简体中文译名
#   locked: true = 高价值锁定词(多词条冲突时优先; 工单点名词一律 locked)
#
# 词条规范: 整句精确命中直接返回(confidence=1.0); 规则引擎可复用其短语替换。

