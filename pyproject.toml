[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "df-fanyi"
version = "0.1.0"
description = "DF-FanYi 矮人要塞 AI 动态汉化引擎 —— Python 翻译内核(ticket-003 骨架)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
df-fanyi = "df_fanyi.cli:main"

[tool.setuptools.packages.find]
include = ["df_fanyi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
